[project]
name = "shiftright"
version = "0.1.0"
description = "Retrieval-augmented assistant for Australian workplace-rights questions, with cited answers."
authors = [{ name = "Sheldon Kiprono" }]
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
